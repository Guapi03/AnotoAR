<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="AnotoAR augmented reality project demo"
  >

  <title>AnotoAR — Project Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      display: flex;
      justify-content: center;
      color: #f8fafc;
      background:
        radial-gradient(circle at top, #263875 0%, transparent 38%),
        linear-gradient(145deg, #050816, #111936);
    }

    main {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      margin-bottom: 14px;
      padding: 7px 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      color: #c7d2fe;
      background: rgba(255, 255, 255, 0.07);
      font-size: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 72px);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .description {
      max-width: 600px;
      margin: 20px auto 32px;
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.6;
    }

    .video-wrapper {
      width: min(100%, 380px);
      aspect-ratio: 9 / 16;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      background: #000;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45),
        0 0 50px rgba(99, 102, 241, 0.18);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .actions {
      margin-top: 30px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 20px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      font-weight: 700;
      text-decoration: none;
      transition:
        transform 160ms ease,
        background 160ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.14);
    }

    .button.primary {
      border-color: #6366f1;
      background: #4f46e5;
    }

    .button.primary:hover {
      background: #6366f1;
    }

    footer {
      margin-top: 42px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main>
    <div class="badge">Unity AR Project</div>

    <h1>AnotoAR</h1>

    <p class="description">
      An augmented reality experience developed with Unity.
      Watch the project demonstration below.
    </p>

    <div class="video-wrapper">
      <iframe
        src="https://www.youtube-nocookie.com/embed/1MdkWUGiNzo?rel=0"
        title="AnotoAR project demonstration"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

    <div class="actions">
      <a
        class="button primary"
        href="https://www.youtube.com/shorts/1MdkWUGiNzo"
        target="_blank"
        rel="noopener noreferrer">
        ▶ Watch on YouTube
      </a>

      <a
        class="button"
        href="https://github.com/Guapi03/AnotoAR">
        View GitHub Repository
      </a>
    </div>

    <footer>
      © AnotoAR
    </footer>
  </main>
</body>
</html>
